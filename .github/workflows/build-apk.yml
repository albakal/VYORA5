name: Build & Publish VYORA APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept All Remaining Android SDK Licenses
        run: |
          SDKMANAGER_BIN="$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -n "$SDKMANAGER_BIN" ]; then
            yes | "$SDKMANAGER_BIN" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare environment config
        env:
          AGORA_APP_ID: ${{ secrets.AGORA_APP_ID }}
        run: |
          {
            printf 'AGORA_APP_ID=%s\n' "${AGORA_APP_ID:-YOUR_AGORA_APP_ID}"
          } > .env

      - name: Prepare Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f app/google-services.json ]; then
            echo "Found existing app/google-services.json in repository."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Wrote app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            echo "::error::Missing app/google-services.json. Upload app/google-services.json to your GitHub repo or add GOOGLE_SERVICES_JSON (or GOOGLE_SERVICES_JSON_BASE64) in GitHub Repository Secrets."
            exit 1
          fi

      - name: Prepare signing keystore & build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            keytool -list -v -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" | grep -E "SHA1:|SHA256:" || true
            gradle :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk VYORA.apk
          else
            if [ ! -f debug.keystore ]; then
              if [ -f debug.keystore.base64 ]; then
                base64 -d debug.keystore.base64 > debug.keystore
              elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
                echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
              else
                keytool -genkeypair -v \
                  -keystore debug.keystore \
                  -storepass android \
                  -alias androiddebugkey \
                  -keypass android \
                  -keyalg RSA \
                  -keysize 2048 \
                  -validity 10000 \
                  -dname "CN=Android Debug,O=Android,C=US"
              fi
            fi
            keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1:|SHA256:" || true
            gradle :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk VYORA.apk
          fi

      - name: Verify APK exists
        run: ls -lh VYORA.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYORA-apk
          path: VYORA.apk

      - name: Publish GitHub Release with Direct Download Link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vyora-latest
          name: VYORA Latest Android APK
          body: Automated Android APK build for VYORA (Firebase Edition).
          files: VYORA.apk
          make_latest: true
